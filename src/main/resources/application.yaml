spring:
  application:
    name: emspractice

  main:
    banner-mode: off

  datasource:
    url: jdbc:mysql://localhost:3308/emspractice
    username: emspractice
    password: emspractice
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration